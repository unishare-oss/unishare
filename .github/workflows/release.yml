name: Release

on:
  workflow_run:
    workflows: ['Build & Push Docker Images']
    types: [completed]
    branches: [main]

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.29.2'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # workflow_run jobs run on the default branch (dev), so semantic-release
      # would see GITHUB_REF=refs/heads/dev and skip; point it at main.
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          before=$(git describe --tags --abbrev=0 2>/dev/null || true)
          GITHUB_REF=refs/heads/main pnpm exec semantic-release
          after=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${after#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag images with the release version
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for IMAGE in unishare-api unishare-web; do
            SRC="ghcr.io/${OWNER}/${IMAGE}:sha-${SHA}"
            if docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
              docker buildx imagetools create "$SRC" --tag "ghcr.io/${OWNER}/${IMAGE}:v${VERSION}"
              echo "tagged ${IMAGE} v${VERSION} -> ${SRC}"
            else
              echo "no image at ${SRC} (this release didn't touch ${IMAGE}), skipping"
            fi
          done
