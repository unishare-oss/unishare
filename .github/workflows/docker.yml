name: Build & Push Docker Images

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      force_api:
        description: Force build API
        type: boolean
        default: false
      force_web:
        description: Force build Web
        type: boolean
        default: false
      no_cache:
        description: Bust build cache (clean rebuild)
        type: boolean
        default: false

env:
  OWNER: ${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      env: ${{ steps.target.outputs.env }}
      values_file: ${{ steps.target.outputs.values_file }}
      tag_suffix: ${{ steps.target.outputs.tag_suffix }}
      moving_tag: ${{ steps.target.outputs.moving_tag }}
    steps:
      - uses: actions/checkout@v7

      # Which environment this ref deploys to. Everything downstream keys off
      # these four outputs rather than re-testing the ref, so there is one place
      # to look when a build lands in the wrong environment.
      #
      # `main` keeps the exact tags it always used, so production is unaffected
      # by the existence of the dev path.
      - name: Resolve target environment
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "main" ]; then
            ENV=prod
            VALUES_FILE=unishare-chart/values.yaml
            TAG_SUFFIX=""
            MOVING_TAG=latest
          else
            ENV=dev
            VALUES_FILE=unishare-values-dev.yaml
            # The web image bakes API_URL/APP_URL and NEXT_PUBLIC_* at build time,
            # so the same commit produces a DIFFERENT web image per environment.
            # The suffix keeps them from overwriting each other. The API image is
            # env-agnostic but carries the suffix too, so one tag pattern covers
            # both and the values file never mixes conventions.
            TAG_SUFFIX="-dev"
            MOVING_TAG=dev
          fi
          {
            echo "env=$ENV"
            echo "values_file=$VALUES_FILE"
            echo "tag_suffix=$TAG_SUFFIX"
            echo "moving_tag=$MOVING_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "$REF_NAME -> $ENV (tags: $MOVING_TAG, sha-<commit>$TAG_SUFFIX)"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Dockerfile.api'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Dockerfile.web'

  build-api:
    name: Build API image
    needs: changes
    if: (github.event_name == 'push' && needs.changes.outputs.api == 'true') || inputs.force_api
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          no-cache: ${{ inputs.no_cache == true }}
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/unishare-api:${{ needs.changes.outputs.moving_tag }}
            ghcr.io/${{ env.OWNER }}/unishare-api:sha-${{ github.sha }}${{ needs.changes.outputs.tag_suffix }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build Web image
    needs: changes
    if: (github.event_name == 'push' && needs.changes.outputs.web == 'true') || inputs.force_web
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          no-cache: ${{ inputs.no_cache == true }}
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/unishare-web:${{ needs.changes.outputs.moving_tag }}
            ghcr.io/${{ env.OWNER }}/unishare-web:sha-${{ github.sha }}${{ needs.changes.outputs.tag_suffix }}
          build-args: |
            API_URL=${{ needs.changes.outputs.env == 'dev' && secrets.DEV_API_URL || secrets.API_URL }}
            APP_URL=${{ needs.changes.outputs.env == 'dev' && secrets.DEV_APP_URL || secrets.APP_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Write image tags to GitOps repo
    needs: [changes, build-api, build-web]
    if: >-
      always() &&
      (needs.build-api.result == 'success' || needs.build-web.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: gitops-write-back
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: k8s-practice

      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: unishare-oss/k8s-practice
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update image tags
        working-directory: gitops
        env:
          API_BUILT: ${{ needs.build-api.result == 'success' }}
          WEB_BUILT: ${{ needs.build-web.result == 'success' }}
          SHA: ${{ github.sha }}
          F: ${{ needs.changes.outputs.values_file }}
          TAG_SUFFIX: ${{ needs.changes.outputs.tag_suffix }}
        run: |
          set -euo pipefail
          TAG="sha-${SHA}${TAG_SUFFIX}"

          # `yq -i` will not create a missing file, and a silent failure here is
          # the failure mode this whole pipeline exists to avoid.
          if [ ! -f "$F" ]; then
            echo "::error::${F} does not exist in the GitOps repo -- nothing to deploy into."
            exit 1
          fi

          if [ "$API_BUILT" = "true" ]; then
            yq -i ".image.api.tag = \"${TAG}\"" "$F"
            echo "api -> ${TAG}"
          fi
          if [ "$WEB_BUILT" = "true" ]; then
            yq -i ".image.web.tag = \"${TAG}\"" "$F"
            echo "web -> ${TAG}"
          fi

          echo "--- resulting image block ---"
          yq '.image' "$F"

      - name: Commit and publish
        working-directory: gitops
        env:
          SHA: ${{ github.sha }}
          F: ${{ needs.changes.outputs.values_file }}
          TARGET_ENV: ${{ needs.changes.outputs.env }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No tag change (this commit is already deployed) -- nothing to do."
            exit 0
          fi
          git config user.name  "unishare-ci[bot]"
          git config user.email "unishare-ci[bot]@users.noreply.github.com"
          git add "$F"
          if [ "$TARGET_ENV" = "prod" ]; then
            git commit -m "deploy: unishare @ ${SHA:0:7}"
          else
            git commit -m "deploy: unishare ${TARGET_ENV} @ ${SHA:0:7}"
          fi
          git -c push.default=current push origin HEAD:main || {
            echo "rejected -- rebasing onto latest main and retrying once"
            git pull --rebase origin main
            git -c push.default=current push origin HEAD:main
          }
